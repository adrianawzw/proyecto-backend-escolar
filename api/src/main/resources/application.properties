spring.application.name=api

# SERVER
server.port=${PORT:8080}

# SPRING DATASOURCE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE CONFIGURATION
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# HikariCP Connection Pool (Optimizado para Supabase)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JWT CONFIGURATION
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# PROXY HEADERS (Render)
server.forward-headers-strategy=framework

# RECUPERACION POR OTP (SMS)
app.recuperacion.pepper=${OTP_PEPPER:${JWT_SECRET}}
app.recuperacion.otp-minutos=5
app.recuperacion.token-minutos=10
app.recuperacion.cooldown-segundos=60
app.recuperacion.max-intentos=3
app.recuperacion.limite-por-ip=10
app.recuperacion.limite-por-celular=5
app.recuperacion.ventana-minutos=15

# TWILIO SMS (opcional hasta configurar en Render)
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.from-number=${TWILIO_FROM_NUMBER:}
app.twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID:}